# Production: compiled build, non-root, healthcheck.
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      IP_ADDRESS: 0.0.0.0
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
