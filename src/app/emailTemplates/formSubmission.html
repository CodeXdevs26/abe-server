<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Contact Form Submission</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        background-color: #f4f4f4;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }
      .header {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        padding-bottom: 10px;
        border-bottom: 2px solid #f4f4f4;
      }
      .content {
        margin-top: 15px;
        font-size: 16px;
      }
      .footer {
        margin-top: 20px;
        font-size: 14px;
        color: #555;
        text-align: center;
        color: #4d4d4d;
      }
      .highlight {
        font-weight: bold;
        color: #ff6600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">New Contact Form Submission</div>
      <div class="content">
        <p>
          <strong>From:</strong>
          <span class="highlight">{{name}}</span>
        </p>
        <p><strong>Email:</strong> <span class="highlight">{{email}}</span></p>
        <hr />
        <p><strong>Message:</strong></p>
        <p>{{message}}</p>
      </div>
      <div class="footer">
        <p>This message was sent from the contact form on your website.</p>
      </div>
    </div>
  </body>
</html>
